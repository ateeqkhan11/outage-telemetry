# Once a day: verify yesterday's results for every network, write the day's manifest (counts, gaps, chain check,
# SHA-256 of each network's records) and commit it to the `data` branch. The commit is the public timestamp:
# changing any record later would no longer match it. `main` stays code-only and protected.
name: daily-file
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to build (YYYY-MM-DD); default yesterday"
        required: false
permissions:
  contents: write
concurrency:
  group: daily-file            # pushes to `data` retry with a rebase if the probe pushed at the same moment
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Open the data branch
        run: bash scripts/data_branch.sh open store
      - name: Build from R2
        if: vars.STORAGE == 'r2'
        run: python -m probe.daily --keys keys --copy-to store/daily ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - name: Build from the data branch
        if: vars.STORAGE != 'r2'
        run: python -m probe.daily --keys keys --local store --manifest-only ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: Commit
        run: bash scripts/data_branch.sh save store "daily manifest ${{ inputs.date || 'yesterday' }}"
