# GitHub Actions probe network. GitHub only allows a schedule every 5 minutes and often starts runs late,
# so each run probes once a minute for 6 minutes. Runs queue instead of overlapping (concurrency), which keeps the
# signed chain linear. Scheduled at :03, :08, ... to avoid the busy top of the hour.
name: probe-github
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
concurrency:
  group: probe-github
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe AWS us-east-1 every minute for 6 minutes
        run: python -m probe.run --network github --minutes 6
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PROBE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROBE_AWS_SECRET_ACCESS_KEY }}
          PROBE_SIGNING_KEY: ${{ secrets.PROBE_SIGNING_KEY_GITHUB }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          PROBE_BUCKET: ${{ vars.PROBE_BUCKET }}
          PROBE_TABLE: ${{ vars.PROBE_TABLE }}
          PROBE_FUNCTION: ${{ vars.PROBE_FUNCTION }}
