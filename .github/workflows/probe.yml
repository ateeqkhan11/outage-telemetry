# GitHub Actions probe network. GitHub only allows a schedule every 5 minutes and often starts runs late,
# so each run probes 6 times a minute for 6 minutes. Runs queue instead of overlapping (concurrency), which keeps the
# signed chain linear. Scheduled at :03, :08, ... to avoid the busy top of the hour.
#
# Storage: by default results are committed to the `data` branch of this repo (repository variable STORAGE unset or
# "git"). Set STORAGE=r2 once the Cloudflare R2 secrets exist to write to R2 instead.
name: probe-github
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
concurrency:
  group: probe-github
  cancel-in-progress: false
permissions:
  contents: write
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.PROBE_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.PROBE_AWS_SECRET_ACCESS_KEY }}
  PROBE_SIGNING_KEY: ${{ secrets.PROBE_SIGNING_KEY_GITHUB }}
  PROBE_BUCKET: ${{ vars.PROBE_BUCKET }}
  PROBE_TABLE: ${{ vars.PROBE_TABLE }}
  PROBE_FUNCTION: ${{ vars.PROBE_FUNCTION }}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Probe to R2
        if: vars.STORAGE == 'r2'
        run: python -m probe.run --network github --minutes 6
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}

      - name: Probe to the data branch
        if: vars.STORAGE != 'r2'
        run: |
          bash scripts/data_branch.sh open store
          python -m probe.run --network github --minutes 6 --local store
          if [ -n "${{ vars.REF_BUCKET }}" ]; then          # copy the reference probe's results (AWS Lambda, Oregon)
            for d in $(date -u -d yesterday +%F) $(date -u +%F); do
              aws s3 sync --only-show-errors "s3://${{ vars.REF_BUCKET }}/runs/aws/$d" "store/runs/aws/$d" || true
            done
            aws s3 cp --only-show-errors "s3://${{ vars.REF_BUCKET }}/chains/aws/head.json" store/chains/aws/head.json || true
          fi
          if [ -n "${{ vars.CF_PROBE_URL }}" ]; then        # copy the Cloudflare probe's results (second operator)
            python scripts/pull_cloudflare.py --url "${{ vars.CF_PROBE_URL }}" --store store || echo "cloudflare pull failed"
          fi
          for n in aws cloudflare; do python scripts/prune_forks.py --store store --network $n || true; done
          python -m probe.status --local store --keys keys --config trigger_v1_rolling.json || echo "status build failed (probe data still saved)"
          bash scripts/data_branch.sh save store "probe github $(date -u +%Y-%m-%dT%H:%MZ)"
