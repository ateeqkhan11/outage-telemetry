{% extends "base.html" %}{% block title %}Account · Nimbus Index{% endblock %}
{% block body %}
<div class="narrow">
  <h1>Your account</h1>
  <p class="lede">{{ me.name }} · {{ me.email }}{% if me.company %} · {{ me.company }}{% endif %}</p>
  {% if msg %}<p class="alert ok">{{ msg }}</p>{% endif %}
  {% if err %}<p class="alert err">{{ err }}</p>{% endif %}
  <form class="stack panel" method="post" style="margin-top:16px">
    <h2 style="font-size:18px;margin:0">Change password</h2>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="email" name="username" value="{{ me.email }}" autocomplete="username" hidden>
    <label>Current password<input type="password" id="current" name="current" required autocomplete="current-password"></label>
    <label>New password <small>at least {{ min_pw }} characters</small><input type="password" id="password" name="password" required minlength="{{ min_pw }}" autocomplete="new-password"></label>
    <label>Type it again<input type="password" id="password2" name="password2" required minlength="{{ min_pw }}" autocomplete="new-password"></label>
    <div><button type="submit">Change password</button></div>
  </form>
</div>
{% endblock %}
