{% extends "base.html" %}{% block title %}Welcome · Nimbus Index{% endblock %}
{% block band %}<section class="band band-slim"><div class="band-in"><div><h1>Welcome to the Nimbus Index pilot</h1><p class="lede">Set up your account for <b style="color:#fff">{{ inv.email }}</b>.</p></div></div></section>{% endblock %}
{% block body %}
<div class="narrow">
  {% if err %}<p class="alert err">{{ err }}</p>{% endif %}
  <form class="stack panel panel-body" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="email" name="username" value="{{ inv.email }}" autocomplete="username" hidden>
    <label>Your name<input type="text" id="name" name="name" value="{{ request.form.name or inv.name }}" required maxlength="120" autocomplete="name"></label>
    <label>Company<input type="text" id="company" name="company" value="{{ request.form.company or inv.company }}" maxlength="120" autocomplete="organization"></label>
    <label>Choose a password <small>at least {{ min_pw }} characters</small><input type="password" id="password" name="password" required minlength="{{ min_pw }}" autocomplete="new-password"></label>
    <label>Type it again<input type="password" id="password2" name="password2" required minlength="{{ min_pw }}" autocomplete="new-password"></label>
    <div><button type="submit">Create account</button></div>
  </form>
</div>
{% endblock %}
