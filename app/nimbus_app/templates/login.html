{% extends "base.html" %}{% block title %}Sign in · Nimbus Index{% endblock %}
{% block body %}
<div class="narrow">
  <h1>Sign in</h1>
  {% if err %}<p class="alert err">{{ err }}</p>{% endif %}
  <form class="stack panel" method="post" style="margin-top:16px">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <label>Email<input type="email" id="email" name="email" value="{{ email }}" required autocomplete="username" autofocus></label>
    <label>Password<input type="password" id="password" name="password" required autocomplete="current-password"></label>
    <div><button type="submit">Sign in</button></div>
  </form>
  <p class="muted" style="font-size:14px">No account yet? Access is by invitation. <a href="{{ url_for('web.request_access') }}">Request pilot access</a>.</p>
</div>
{% endblock %}
